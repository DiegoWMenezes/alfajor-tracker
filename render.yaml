services:
  - type: web
    name: alfajor-tracker
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
